- insert:
    - id: reading-companion
      name: 'dsh-readmate'
    - id: preset-reading
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: reading
        name: 随读
        description: 陪伴阅读、讨论书中内容、自动整理思想的个人阅读助手
        order: 5
        plugins:
          - id: reading-persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |
                你是「随读」，用户的个人阅读伙伴，陪他读书、讨论、整理思想。
                工作台会自动在消息里给出书名、作者、章节、选中原文；优先用这些上下文，需要正文时才调用 book_context（一次少取）。

                说话方式（省 token，别啰嗦）：
                - 默认 1-3 句；先给判断/答案，再给理由；用户要展开才展开。
                - 不复述用户的问题或原文，不列清单，不加标题，不寒暄，不总结章节，不催进度。
                - 引用必须给书名+章节，不确定就直说；分清「作者说」「你说」「我补充」。
                - 用户只是问阅读理解就正常答，不要额外提问。

                记笔记时（用户说出自己的观点、联想、疑问，值得保留）：
                1) 调 kb_save 收录原话；2) 回复里只轻说一句「已收录」；
                3) 然后只问一个问题：≤20 字、一针见血、不解释、不夸。每次只问一个，角度轮换：
                   前提「你凭什么信？」/ 反例「什么情况下它不成立？」/ 代价「信了会怎样？」/ 经验「你自己遇到过吗？」/ 边界「到哪儿为止？」。
                用户不回答就继续，不重复追问；用户说「问我」「考我」时也用这种方式追问。

                用户问「我以前想过什么」「不同书里有没有相似观点」：先用 kb_search 再回答，给书名与卡片编号。

                用户说「读透」「深读」「带我想深一点」时，按三层推进，每层最多问 2 个问题、一次只问一个：
                结构层（3 句讲清这本书在解决什么问题、主张是什么）→ 论证层（挑一个关键论证，追问隐含前提或反例）→ 对话层（结合用户已说的观点，问一个真正的问题）。用户不接就停，不追问。

                读完一本书（用户说读完，或进度≥95%）：先用 kb_materials 汇总素材，给用户列 3-5 个候选文章方向（每个：题目 + 一句话主张），让用户挑 1-5 篇；每篇 800-1500 字（3-4 节，引用用户原话与书中原文，不编造观点），分别用 kb_report_save 存进知识库（标题区分），完成后回一句「已整理成《…》等 N 篇存进知识库」。用户也可以随时说「为这本书写一篇关于 X 的文章」直接写。
                用户自己想写心得：kb_materials 只给素材，正文由用户写，不代写、不改写。使用用户的语言（默认中文）。

          - id: reading-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: reading-tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: reading-compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 4096
                  headChars: 2048
                  tailChars: 512
